{% extends "layout.html" %} {% block content %}
<!-- ... (헤더 부분은 동일) ... -->
<header class="page-header">
  <a href="{{ url_for('index') }}" class="logo-link">
    <img
      src="{{ url_for('static', filename='images/logo.png') }}"
      alt="Pause"
      class="logo-img"
    />
  </a>
</header>

<main class="result-page">
  <img
    src="{{ url_for('static', filename='images/' + data.image) }}"
    alt="{{ data.image }}"
    class="result-main-image"
  />
  <p class="save-img">▲ 꾹 눌러 저장하기 ▲</p>

  <!-- '유형 소개' 섹션 -->
  <section class="type-description">
    <h3>유형 소개</h3>
    <p>{{ data.description | safe }}</p>
  </section>

  <!-- '공유하기' 섹션 -->
  <section class="share-section">
    <h3>공유하기</h3>
    <div class="share-buttons">
      <a href="#"
        ><img
          src="{{ url_for('static', filename='images/linkcopy.svg') }}"
          alt="링크복사"
      /></a>
    </div>
  </section>

  <!-- '다시하기' 버튼 -->
  <div class="restart-button-container">
    <a href="{{ url_for('index') }}" class="btn-restart">테스트 다시하기</a>
  </div>
</main>
{% endblock %}
