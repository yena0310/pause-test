<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>퍼스널 쉼 유형 테스트</title>

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="180x180"
        href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">

  <!-- Open Graph (카톡/페북 등 공유 썸네일) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="퍼스널 쉼 유형 테스트">
  <meta property="og:description" content="나는 어떻게 쉬는 유형일까?">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('static', filename='images/share.png', _external=True) }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card (선택) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="퍼스널 쉼 유형 테스트">
  <meta name="twitter:description" content="나는 어떻게 쉬는 유형일까?">
  <meta name="twitter:image" content="{{ url_for('static', filename='images/share.png', _external=True) }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
