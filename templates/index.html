{% extends "layout.html" %} {% block content %}
<main class="start-page">
  <div class="scroll-content">
    <img src="{{ url_for('static', filename='images/logo.png')}}" alt="pause 로고" class="logo-main" />
    <h1>퍼스널 쉼<br />유형 테스트</h1>
    <p>나는 어떻게 쉬는 유형일까?</p>

    <div class="character-zone">
      <img src="{{ url_for('static', filename='images/char1.png') }}" alt="char1" />
      <img src="{{ url_for('static', filename='images/char2.png') }}" alt="char2" />
      <img src="{{ url_for('static', filename='images/char3.png') }}" alt="char3" />
      <img src="{{ url_for('static', filename='images/char4.png') }}" alt="char4" />
      <img src="{{ url_for('static', filename='images/char5.png') }}" alt="char5" />
      <img src="{{ url_for('static', filename='images/char6.png') }}" alt="char6" />    
    </div>
  </div>
  <div class="fixed-button-container">
    <a href="{{ url_for('question', q_id=1) }}" class="btn-start">시작하기</a>
  </div>
</main>
{% endblock %}
